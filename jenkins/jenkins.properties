# CircleGuard Jenkins Project Configuration
# This file contains project-level configuration that belongs to the repository.
# User-specific settings are configured
# as Global Properties in Jenkins UI (Manage Jenkins > System > Environment variables).
#
# Required Global Properties in Jenkins:
#   CG_DOCKER_USER              - DockerHub username (default: srcracles)
#   CG_GITHUB_OWNER             - GitHub repository owner (default: SrCracles)
#   CG_GITHUB_REPO              - GitHub repository name (default: circle-guard-public)

# --- E2E Test Paths ---
NEWMAN_COLLECTION=tests/postman/circle-guard-e2e-collection.json
NEWMAN_ENVIRONMENT=tests/postman/circle-guard-environment.json

# --- Load Test Paths ---
LOCUST_PERF_FILE=tests/locustfile-performance.py
LOCUST_STRESS_FILE=tests/locustfile-stress.py

# --- Security Scan Paths (HU-22) ---
ZAP_SCAN_SCRIPT=tests/zap/run-zap-scans.sh

# --- Pipeline Notifications (HU-17) ---
# Configure as Global Property in Jenkins (Manage Jenkins > System > Environment variables):
#   CG_NOTIFY_EMAIL - Recipient email for pipeline failure/recovery alerts (Email Extension plugin recommended)
