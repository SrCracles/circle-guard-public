apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - zookeeper.yaml
  - redis.yaml
  - neo4j.yaml
  - openldap.yaml
  - postgresql.yaml
  - kafka.yaml
  - sonarqube.yaml
  - kube-state-metrics.yaml
  - node-exporter.yaml
  - prometheus.yaml
  - alert-webhook.yaml
  - grafana.yaml

configMapGenerator:
  - name: grafana-dashboards
    files:
      - grafana-dashboards/circleguard-system-overview.json
      - grafana-dashboards/circleguard-service-detail.json
      - grafana-dashboards/circleguard-business-metrics.json

labels:
  - pairs:
      component: infrastructure
    includeSelectors: true
