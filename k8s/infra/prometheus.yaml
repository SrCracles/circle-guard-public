apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  labels:
    app: prometheus
    component: infrastructure
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
  labels:
    app: prometheus
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: infra
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app: prometheus
    component: infrastructure
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: kube-state-metrics
        static_configs:
          - targets: ["kube-state-metrics.infra.svc.cluster.local:8080"]

      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [infra]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: node-exporter
            action: keep

      - job_name: circleguard-microservices
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - circleguard-auth-service.stage.svc.cluster.local:8180
              - circleguard-identity-service.stage.svc.cluster.local:8083
              - circleguard-form-service.stage.svc.cluster.local:8086
              - circleguard-promotion-service.stage.svc.cluster.local:8088
              - circleguard-notification-service.stage.svc.cluster.local:8082
              - circleguard-gateway-service.stage.svc.cluster.local:8087
              - circleguard-file-service.stage.svc.cluster.local:8085
              - circleguard-dashboard-service.stage.svc.cluster.local:8084
            labels:
              namespace: stage
          - targets:
              - circleguard-auth-service.dev.svc.cluster.local:8180
              - circleguard-identity-service.dev.svc.cluster.local:8083
              - circleguard-form-service.dev.svc.cluster.local:8086
              - circleguard-promotion-service.dev.svc.cluster.local:8088
              - circleguard-notification-service.dev.svc.cluster.local:8082
              - circleguard-gateway-service.dev.svc.cluster.local:8087
              - circleguard-file-service.dev.svc.cluster.local:8085
              - circleguard-dashboard-service.dev.svc.cluster.local:8084
            labels:
              namespace: dev
          - targets:
              - circleguard-auth-service.master.svc.cluster.local:8180
              - circleguard-identity-service.master.svc.cluster.local:8083
              - circleguard-form-service.master.svc.cluster.local:8086
              - circleguard-promotion-service.master.svc.cluster.local:8088
              - circleguard-notification-service.master.svc.cluster.local:8082
              - circleguard-gateway-service.master.svc.cluster.local:8087
              - circleguard-file-service.master.svc.cluster.local:8085
              - circleguard-dashboard-service.master.svc.cluster.local:8084
            labels:
              namespace: master
        relabel_configs:
          - source_labels: [__address__]
            regex: 'circleguard-([^.]+)\..*'
            target_label: service
            replacement: '${1}'

      - job_name: locust-exporter
        static_configs:
          - targets: ["locust-exporter.stage.svc.cluster.local:9646"]
            labels:
              namespace: stage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app: prometheus
    component: infrastructure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
        component: infrastructure
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.2
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
            - --web.enable-lifecycle
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    app: prometheus
    component: infrastructure
spec:
  type: NodePort
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30091
  selector:
    app: prometheus
