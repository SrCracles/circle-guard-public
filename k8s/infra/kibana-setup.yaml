apiVersion: v1
kind: ConfigMap
metadata:
  name: kibana-setup
  labels:
    app: kibana
    component: infrastructure
data:
  setup.sh: |
    #!/bin/sh
    set -e
    KIBANA_URL="http://kibana.infra.svc.cluster.local:5601"
    echo "Waiting for Kibana..."
    until curl -sf "$KIBANA_URL/api/status" | grep -q '"level":"available"'; do
      sleep 10
    done
    echo "Importing CircleGuard saved objects..."
    curl -sf -X POST "$KIBANA_URL/api/saved_objects/_import?overwrite=true" \
      -H "kbn-xsrf: true" \
      --form file=@/saved-objects/circleguard-saved-objects.ndjson
    echo "Kibana setup complete."
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kibana-setup
  labels:
    app: kibana
    component: infrastructure
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: kibana-setup
        component: infrastructure
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-elasticsearch
          image: curlimages/curl:8.5.0
          command:
            - sh
            - -c
            - |
              until curl -sf http://elasticsearch.infra.svc.cluster.local:9200/_cluster/health?wait_for_status=yellow; do
                echo "Waiting for Elasticsearch..."
                sleep 10
              done
      containers:
        - name: import-saved-objects
          image: curlimages/curl:8.5.0
          command: ["/bin/sh", "/scripts/setup.sh"]
          volumeMounts:
            - name: setup-script
              mountPath: /scripts
            - name: saved-objects
              mountPath: /saved-objects
      volumes:
        - name: setup-script
          configMap:
            name: kibana-setup
            defaultMode: 0755
        - name: saved-objects
          configMap:
            name: kibana-saved-objects
