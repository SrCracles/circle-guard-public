apiVersion: v1
kind: ConfigMap
metadata:
  name: circleguard-config
data:
  # PostgreSQL configuration
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgresql.infra.svc.cluster.local:5432/circleguard"
  SPRING_DATASOURCE_USERNAME: "admin"
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: "org.postgresql.Driver"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: "org.hibernate.dialect.PostgreSQLDialect"

  # Kafka configuration
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka.infra.svc.cluster.local:9092"
  SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET: "earliest"
  SPRING_KAFKA_CONSUMER_KEY_DESERIALIZER: "org.apache.kafka.common.serialization.StringDeserializer"
  SPRING_KAFKA_CONSUMER_VALUE_DESERIALIZER: "org.springframework.kafka.support.serializer.JsonDeserializer"
  SPRING_KAFKA_PRODUCER_KEY_SERIALIZER: "org.apache.kafka.common.serialization.StringSerializer"
  SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER: "org.springframework.kafka.support.serializer.JsonSerializer"

  # Redis configuration
  SPRING_DATA_REDIS_HOST: "redis.infra.svc.cluster.local"
  SPRING_DATA_REDIS_PORT: "6379"

  # Neo4j configuration
  SPRING_NEO4J_URI: "bolt://neo4j.infra.svc.cluster.local:7687"
  SPRING_NEO4J_AUTHENTICATION_USERNAME: "neo4j"

  # LDAP configuration
  SPRING_LDAP_URLS: "ldap://ldap.infra.svc.cluster.local:389"
  SPRING_LDAP_BASE: "dc=circleguard,dc=edu"
  SPRING_LDAP_USERNAME: "cn=admin,dc=circleguard,dc=edu"

  # JWT configuration
  JWT_SECRET: "my-super-secret-dev-key-32-chars-long-12345678"
  JWT_EXPIRATION: "3600000"

  # QR configuration
  QR_SECRET: "my-qr-secret-key-for-dev-1234567890"
  QR_EXPIRATION: "300"

  # Identity vault
  VAULT_SECRET: "746573742d7365637265742d33322d63686172732d6c6f6e672d313233343536"
  VAULT_SALT: "deadbeef"
  VAULT_HASH_SALT: "12345678"

  # Auth API URL for notification service
  AUTH_API_URL: "http://circleguard-auth-service:8180"

  # Identity service URL for auth service
  IDENTITY_SERVICE_URL: "http://circleguard-identity-service:8083"

  # Kafka JSON deserializer trusted packages
  SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_TRUSTED_PACKAGES: "*"

  # Feature Toggles
  FEATURE_TOGGLE_EMAIL_ENABLED: "true"

  # Distributed tracing (Jaeger via Zipkin API)
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: "http://jaeger.infra.svc.cluster.local:9411/api/v2/spans"

  # Centralized logging (ELK / Logstash)
  LOGSTASH_HOST: "logstash.infra.svc.cluster.local"
  LOGSTASH_PORT: "5044"

  # Kafka tracing propagation
  SPRING_KAFKA_TEMPLATE_OBSERVATION_ENABLED: "true"
  SPRING_KAFKA_LISTENER_OBSERVATION_ENABLED: "true"

