apiVersion: apps/v1
kind: Deployment
metadata:
  name: circleguard-file-service
  labels:
    app: circleguard-file-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: circleguard-file-service
  template:
    metadata:
      labels:
        app: circleguard-file-service
    spec:
      serviceAccountName: circleguard-file-sa
      containers:
        - name: circleguard-file-service
          image: circleguard-file-service
          imagePullPolicy: Always
          ports:
            - containerPort: 8085
          envFrom:
            - configMapRef:
                name: circleguard-config
            - secretRef:
                name: circleguard-secrets
          env:
            - name: SPRING_APPLICATION_NAME
              value: "circleguard-file-service"
            - name: MANAGEMENT_METRICS_TAGS_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8085
            initialDelaySeconds: 50
            periodSeconds: 15
            failureThreshold: 3
