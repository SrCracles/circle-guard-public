apiVersion: apps/v1
kind: Deployment
metadata:
  name: circleguard-dashboard-service
  labels:
    app: circleguard-dashboard-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: circleguard-dashboard-service
  template:
    metadata:
      labels:
        app: circleguard-dashboard-service
    spec:
      serviceAccountName: circleguard-dashboard-sa
      containers:
        - name: circleguard-dashboard-service
          image: circleguard-dashboard-service
          imagePullPolicy: Always
          ports:
            - containerPort: 8084
          envFrom:
            - configMapRef:
                name: circleguard-config
            - secretRef:
                name: circleguard-secrets
          env:
            - name: SPRING_APPLICATION_NAME
              value: "circleguard-dashboard-service"
            - name: MANAGEMENT_METRICS_TAGS_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgresql.infra.svc.cluster.local:5432/circleguard_dashboard"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8084
            initialDelaySeconds: 50
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8084
            initialDelaySeconds: 75
            periodSeconds: 15
            failureThreshold: 3
